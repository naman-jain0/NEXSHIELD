<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexShield | Cybersecurity Quiz</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(120deg, #080b2c, #0759a5);
            color: white;
            min-height: 100vh;
            padding: 25px 16px 40px;
        }

        header {
            text-align: center;
            padding: 15px 0 25px;
        }

        header h1 {
            color: #00eaff;
            font-size: 30px;
            letter-spacing: 4px;
        }

        header p {
            margin-top: 10px;
            color: #d0eaff;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 35px;
        }

        nav a {
            color: white;
            text-decoration: none;
            border: 1px solid #00d9ff;
            padding: 9px 24px;
            border-radius: 6px;
            transition: 0.3s;
        }

        nav a:hover {
            background: #00d9ff;
            color: #07132e;
        }

        .container {
            width: 100%;
            max-width: 700px;
            margin: auto;
        }

        .quiz-card {
            background: rgba(5, 13, 47, 0.88);
            border: 1px solid #00d9ff;
            border-radius: 14px;
            padding: 30px;
            box-shadow: 0 0 22px rgba(0, 217, 255, 0.12);
        }

        .tag {
            color: #00eaff;
            font-size: 13px;
            letter-spacing: 2px;
            margin-bottom: 18px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            color: #bcd9ff;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .progress-bar {
            height: 6px;
            background: #26365b;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 28px;
        }

        #progress {
            width: 10%;
            height: 100%;
            background: #00eaff;
            transition: width 0.3s;
        }

        #question {
            font-size: 21px;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .option {
            display: block;
            width: 100%;
            text-align: left;
            color: white;
            background: #101d46;
            border: 1px solid #53658f;
            border-radius: 7px;
            padding: 14px;
            margin-bottom: 12px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        .option:hover:not(:disabled) {
            border-color: #00eaff;
            background: #12315d;
        }

        .option:disabled {
            cursor: default;
        }

        .option.correct {
            border-color: #35e89a;
            background: #124a40;
        }

        .option.wrong {
            border-color: #ff6584;
            background: #56243c;
        }

        #feedback {
            min-height: 24px;
            margin: 18px 0;
            line-height: 1.5;
            color: #d6eaff;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 15px;
        }

        .main-btn {
            background: #00d9ff;
            color: #07132e;
            border: none;
            border-radius: 6px;
            padding: 12px 22px;
            font-weight: bold;
            cursor: pointer;
        }

        .main-btn:hover {
            background: #80f3ff;
        }

        .main-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        #result {
            text-align: center;
        }

        #result h2 {
            color: #00eaff;
            font-size: 28px;
            margin: 20px 0;
        }

        #score {
            font-size: 48px;
            font-weight: bold;
            margin: 20px;
        }

        .hidden {
            display: none;
        }

        footer {
            text-align: center;
            color: #bcd9ff;
            font-size: 13px;
            margin-top: 30px;
        }

        @media (max-width: 500px) {
            .quiz-card {
                padding: 20px;
            }

            #question {
                font-size: 18px;
            }

            header h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>NEXSHIELD</h1>
        <p>Stay Alert. Stay Secure.</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="index.html#detection">Detection</a>
        <a href="index.html#about">About</a>
    </nav>

    <main class="container">
        <section class="quiz-card" id="quiz">

            <p class="tag">CYBERSECURITY AWARENESS</p>

            <div class="progress-info">
                <span id="questionCount">Question 1 of 10</span>
                <span id="scoreLive">Score: 0</span>
            </div>

            <div class="progress-bar">
                <div id="progress"></div>
            </div>

            <h2 id="question"></h2>

            <div id="options"></div>

            <p id="feedback" aria-live="polite">
                Select the best answer to continue.
            </p>

            <div class="actions">
                <button class="main-btn" id="nextBtn"
                        onclick="nextQuestion()" disabled>
                    Next Question →
                </button>
            </div>

        </section>

        <section class="quiz-card hidden" id="result">
            <p class="tag">QUIZ COMPLETED</p>

            <h2>Your Security Score</h2>

            <p id="score"></p>

            <p id="message"></p>

            <div class="actions" style="justify-content:center">
                <button class="main-btn" onclick="restartQuiz()">
                    Restart Quiz ↻
                </button>
                <a href="index.html"
                   class="main-btn"
                   style="text-decoration:none">
                    Home
                </a>
            </div>
        </section>
    </main>

    <footer>
        NexShield | Think Before You Click.
    </footer>

    <script>
        const questions = [
            {
                question: "1. What is phishing?",
                options: [
                    "A method of cooling a computer",
                    "A trick to steal sensitive information",
                    "A type of computer monitor",
                    "A method of backing up files"
                ],
                answer: 1,
                explanation: "Phishing uses deceptive messages or websites to steal information."
            },
            {
                question: "2. You receive a suspicious link asking for your bank password. What should you do?",
                options: [
                    "Click it immediately",
                    "Share it with friends",
                    "Avoid the link and verify through official channels",
                    "Enter fake information to test it"
                ],
                answer: 2,
                explanation: "Never enter sensitive details through an unverified link."
            },
            {
                question: "3. Which password is generally the strongest?",
                options: [
                    "12345678",
                    "password123",
                    "Your name and birth year",
                    "A long, unique passphrase"
                ],
                answer: 3,
                explanation: "Long, unique passwords or passphrases are harder to guess."
            },
            {
                question: "4. What does OTP stand for?",
                options: [
                    "One-Time Password",
                    "Online Transfer Program",
                    "Open Text Protocol",
                    "One-Type Process"
                ],
                answer: 0,
                explanation: "OTP means One-Time Password. Never share it with untrusted people."
            },
            {
                question: "5. What should you do before installing an APK?",
                options: [
                    "Disable all security features",
                    "Check its source and permissions",
                    "Grant every permission automatically",
                    "Install every file received by SMS"
                ],
                answer: 1,
                explanation: "Verify the source and requested permissions before installing an app."
            },
            {
                question: "6. What is two-factor authentication (2FA)?",
                options: [
                    "Using two usernames",
                    "Changing your password twice daily",
                    "Using two different verification factors",
                    "Sharing your account with two people"
                ],
                answer: 2,
                explanation: "2FA adds another verification factor beyond your password."
            },
            {
                question: "7. A caller claims to be from your bank and asks for your OTP. What is safest?",
                options: [
                    "Share it if the caller knows your name",
                    "Share it after asking their employee ID",
                    "Send it through a text message",
                    "Do not share it; contact your bank using an official number"
                ],
                answer: 3,
                explanation: "Do not disclose OTPs to callers. Verify independently with your bank."
            },
            {
                question: "8. What is malware?",
                options: [
                    "Software designed to cause harm or perform unwanted actions",
                    "A secure password manager",
                    "A computer cleaning tool",
                    "A normal system update"
                ],
                answer: 0,
                explanation: "Malware includes malicious software such as spyware, ransomware and viruses."
            },
            {
                question: "9. Why should you install security updates?",
                options: [
                    "To make every website trustworthy",
                    "To fix vulnerabilities and improve security",
                    "To eliminate the need for passwords",
                    "To guarantee that scams never happen"
                ],
                answer: 1,
                explanation: "Updates often patch security vulnerabilities, though they cannot prevent every attack."
            },
            {
                question: "10. You receive an unexpected email attachment. What should you do?",
                options: [
                    "Open it to check its contents",
                    "Forward it to everyone",
                    "Verify the sender and attachment before opening",
                    "Disable your antivirus first"
                ],
                answer: 2,
                explanation: "Unexpected attachments can contain malware. Verify them before opening."
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = false;

        const questionElement = document.getElementById("question");
        const optionsElement = document.getElementById("options");
        const feedbackElement = document.getElementById("feedback");
        const nextBtn = document.getElementById("nextBtn");

        function loadQuestion() {
            answered = false;

            const q = questions[currentQuestion];

            document.getElementById("questionCount").textContent =
                `Question ${currentQuestion + 1} of ${questions.length}`;

            document.getElementById("scoreLive").textContent =
                `Score: ${score}`;

            document.getElementById("progress").style.width =
                `${((currentQuestion + 1) / questions.length) * 100}%`;

            questionElement.textContent = q.question;
            optionsElement.innerHTML = "";
            feedbackElement.textContent =
                "Select the best answer to continue.";

            nextBtn.disabled = true;
            nextBtn.textContent =
                currentQuestion === questions.length - 1
                    ? "View Results →"
                    : "Next Question →";

            q.options.forEach((option, index) => {
                const button = document.createElement("button");

                button.className = "option";
                button.textContent =
                    `${String.fromCharCode(65 + index)}. ${option}`;

                button.onclick = () => selectAnswer(index, button);

                optionsElement.appendChild(button);
            });
        }

        function selectAnswer(selected, selectedButton) {
            if (answered) return;

            answered = true;

            const q = questions[currentQuestion];
            const allOptions = optionsElement.querySelectorAll(".option");

            allOptions.forEach(button => button.disabled = true);

            allOptions[q.answer].classList.add("correct");

            if (selected === q.answer) {
                score++;
                feedbackElement.textContent =
                    "✓ Correct! " + q.explanation;
            } else {
                selectedButton.classList.add("wrong");
                feedbackElement.textContent =
                    "✗ Not quite. " + q.explanation;
            }

            document.getElementById("scoreLive").textContent =
                `Score: ${score}`;

            nextBtn.disabled = false;
        }

        function nextQuestion() {
            if (!answered) return;

            currentQuestion++;

            if (currentQuestion < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById("quiz").classList.add("hidden");

            const result = document.getElementById("result");
            result.classList.remove("hidden");

            document.getElementById("score").textContent =
                `${score} / ${questions.length}`;

            let message;

            if (score >= 9) {
                message = "Excellent! You have strong cybersecurity awareness.";
            } else if (score >= 7) {
                message = "Good job! Keep learning to stay safer online.";
            } else if (score >= 5) {
                message = "Nice effort! Review the basics and try again.";
            } else {
                message = "Keep practising! Learn how to recognise online threats.";
            }

            document.getElementById("message").textContent = message;
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;

            document.getElementById("result").classList.add("hidden");
            document.getElementById("quiz").classList.remove("hidden");

            loadQuestion();
        }

        loadQuestion();
    </script>

</body>
</html>
