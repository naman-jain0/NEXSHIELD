<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">

    <title>NexShield - Message Detection</title>

</head>
<body>
    <div class="custom-cursor">
    <div class="crosshair-ring"></div>
    <div class="crosshair-horizontal"></div>
    <div class="crosshair-vertical"></div>
    <div class="crosshair-center"></div>
</div>

    <h1>NEXSHIELD</h1>

    <a href="index.html" class="hm">Home</a></a>
<div class="detection-card">
    <h2>SMS / Message Detection</h2>
   <p class="line" >Paste the suspicious message below</p>

    <form>
<textarea class="msg"
   rows="6"  
   cols="35" 
   placeholder="paste your message or sms here..." 
></textarea>
<br><br>
<button type="submit">Detect message</button>

    </form>
</div>
<script>
const cursor = document.querySelector(".custom-cursor");

document.addEventListener("mousemove", function(e) {
    cursor.style.left = e.clientX + "px";
    cursor.style.top = e.clientY + "px";
});
</script>
</body>
</html>
