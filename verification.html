<!DOCTYPE html>
<html>
<head>
    <title>NEXSHIELD-Security Verification</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>


<div class="custom-cursor">
    <div class="crosshair-horizontal"></div>
    <div class="crosshair-vertical"></div>
    <div class="crosshair-center"></div>
    <div class="crosshair-ring"></div>
</div>










<div class="verification-container">

<h1>NEXSHIELD</h1>
<p>Stay Alert. Stay Secure.</p>

<div class="welcome-section">
    <h2>Welcome to NEXSHIELD</h2>
    <p>Your security journey starts here</p>
</div>

<div class="security-card">
    <h2>Security Verification</h2>
    <p>Please verify that you are a human visitor.</p>

    <div class="captcha-box">
        <input type="checkbox" id="captcha">
        <label for="captcha">I'm not a robot</label>
    </div>

    <button class="verify-btn">VERIFY & CONTINUE</button>
</div>

<p class="security-note">
    Your privacy matters to us. No personal information required.
</p>

</div>


<script>
document.querySelector(".verify-btn").addEventListener("click", function() {

    const captcha = document.getElementById("captcha");

    if (captcha.checked) {
        window.location.href = "index.html";
    } 
    else {
        alert("Please verify that you are not a robot!");
    }

});
</script>



<script>
document.addEventListener("DOMContentLoaded", function () {

    const cursor = document.querySelector(".custom-cursor");

    if (!cursor) {
        console.log("Custom cursor element not found!");
        return;
    }

    document.addEventListener("mousemove", function(e) {
        cursor.style.left = e.clientX + "px";
        cursor.style.top = e.clientY + "px";
    });

});
</script>









</body>
</html>
